$kind: http-request
description: Inicia sesión y guarda el token automáticamente en la variable {{token}}
url: "{{base_api}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "doctor1",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.token) {
        pm.collectionVariables.set('token', res.token);
        console.log('Token guardado:', res.token);
      }
    language: text/javascript
order: 1000
